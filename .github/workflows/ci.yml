name: Dotfiles CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run ShellCheck
        run: shellcheck install.sh verify.sh update.sh bootstrap.sh uninstall.sh scripts/linux/*.sh scripts/macos/*.sh

  lint-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path .\install.ps1 -Recurse -EnableExit -Severity Error
          Invoke-ScriptAnalyzer -Path .\bootstrap.ps1 -Recurse -EnableExit -Severity Error
          Invoke-ScriptAnalyzer -Path .\windows\Microsoft.PowerShell_profile.ps1 -Recurse -EnableExit -Severity Error
          Invoke-ScriptAnalyzer -Path .\verify.ps1 -Recurse -EnableExit -Severity Error
          Invoke-ScriptAnalyzer -Path .\scripts\windows\ -Recurse -EnableExit -Severity Error
          Invoke-ScriptAnalyzer -Path .\update.ps1 -Recurse -EnableExit -Severity Error

  lint-shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run shfmt
        uses: mvdan/shfmt/gha@v3
        with:
          args: --diff --indent 4 install.sh update.sh verify.sh uninstall.sh bootstrap.sh scripts/linux/env.sh scripts/linux/01-core.sh scripts/linux/02-github.sh scripts/linux/03-shell.sh scripts/linux/04-neovim.sh scripts/linux/99-restore.sh scripts/macos/01-core.sh scripts/macos/03-shell.sh scripts/macos/04-neovim.sh scripts/macos/05-dev.sh scripts/macos/99-restore.sh

  lint-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate JSON files
        run: |
          jq empty themes/catppuccin_mocha.omp.json
          jq empty windows/settings.json
