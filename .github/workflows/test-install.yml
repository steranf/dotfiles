name: Test Installation

# Corre en PRs y cuando cambian los scripts de instalación Linux.
# Los tests toman ~10 min por plataforma — se separan del CI de linting.
on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths:
      - 'install.sh'
      - 'verify.sh'
      - 'scripts/linux/**'
  workflow_dispatch:

jobs:
  test-ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --user root

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar prerequisitos mínimos
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo git ca-certificates

      - name: Ejecutar instalador (modo headless)
        run: bash install.sh --all
        env:
          # Evita prompts de git en contenedores sin HOME configurado
          GIT_CONFIG_NOSYSTEM: "1"
          HOME: /root
          USER: root

      - name: Verificar instalación
        run: bash verify.sh
        env:
          HOME: /root
          USER: root

  test-almalinux:
    name: AlmaLinux 9
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
      options: --user root

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar prerequisitos mínimos
        run: dnf install -y sudo git ca-certificates

      - name: Ejecutar instalador (modo headless)
        run: bash install.sh --all
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          HOME: /root
          USER: root

      - name: Verificar instalación
        run: bash verify.sh
        env:
          HOME: /root
          USER: root
