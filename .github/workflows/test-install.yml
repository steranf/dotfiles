name: Test Installation

# Corre en PRs y cuando cambian los scripts de instalación Linux.
# Los tests toman ~10 min por plataforma — se separan del CI de linting.
on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'verify.sh'
      - 'verify.ps1'
      - 'scripts/linux/**'
      - 'scripts/macos/**'
      - 'scripts/windows/**'
      - 'stow/**'
      - '.github/workflows/test-install.yml'
  workflow_dispatch:

jobs:
  test-ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --user root

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar prerequisitos mínimos
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo git ca-certificates

      - name: Ejecutar instalador (modo headless)
        run: bash install.sh --all
        env:
          # Evita prompts de git en contenedores sin HOME configurado
          GIT_CONFIG_NOSYSTEM: "1"
          HOME: /root
          USER: root

      - name: Verificar instalación
        run: bash verify.sh
        env:
          HOME: /root
          USER: root

  test-windows:
    name: Windows (winget)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Ejecutar instalador (modo headless, sin WSL)
        shell: pwsh
        run: .\install.ps1 -All -SkipWSL

      - name: Refrescar PATH (winget actualiza el registro, no el proceso actual)
        shell: pwsh
        run: |
          $machine = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $user    = [System.Environment]::GetEnvironmentVariable("Path", "User")
          "$machine;$user" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verificar instalación
        shell: pwsh
        run: .\verify.ps1 -SkipWSL

  test-macos:
    name: macOS (Homebrew)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Ejecutar instalador (modo headless)
        run: bash install.sh --all
        env:
          GIT_CONFIG_NOSYSTEM: "1"

      - name: Verificar instalación
        run: bash verify.sh

  test-almalinux:
    name: AlmaLinux 9
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
      options: --user root

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar prerequisitos mínimos
        run: dnf install -y sudo git ca-certificates

      - name: Ejecutar instalador (modo headless)
        run: bash install.sh --all
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          HOME: /root
          USER: root

      - name: Verificar instalación
        run: bash verify.sh
        env:
          HOME: /root
          USER: root
